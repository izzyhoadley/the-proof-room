<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Proof Room</title>
<meta name="description" content="Mathematics Interactive: Specialist Maths notes, interactives and practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/organic.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/site.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/preact.umd.js"></script>
<script src="js/work-pad.js"></script>
<script src="js/image-slot.js"></script>
<script src="js/runtime.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page markup. See js/runtime.js for the template syntax. -->
<script type="text/x-template" id="app-template">
<div style="font-family: Work Sans; color: var(--color-text); min-height: 100vh; background-color: #FDFDFD">

  <header style="display: flex; align-items: center; gap: 26.4px; padding: 17.6px 44px; border-bottom: 1px solid var(--color-divider); position: sticky; top: 0; z-index: 20; background-color: #EE6464">
    <div onClick="{{ goHome }}" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
      <div style="width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-family: var(--font-heading); font-size: 17px; line-height: 1; background-color: #0F0F0F">p</div>
      <span style="font-family: var(--font-heading); font-size: 20px;">The Proof&nbsp;Room</span>
    </div>
    <nav style="display: flex; gap: 4px; margin-left: auto;">
      <button onClick="{{ goHome }}" style="border: 0; background: transparent; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--color-neutral-700); padding: 8.8px 17.6px; border-radius: 999px; cursor: pointer;" style-hover="background: var(--color-accent-200); color: var(--color-accent-800);">Courses</button>
      <button onClick="{{ goCourse }}" style="border: 0; background: transparent; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--color-neutral-700); padding: 8.8px 17.6px; border-radius: 999px; cursor: pointer;" style-hover="background: var(--color-accent-200); color: var(--color-accent-800);">Topics</button>
      <button onClick="{{ goLesson }}" style="border: 0; background: transparent; font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--color-neutral-700); padding: 8.8px 17.6px; border-radius: 999px; cursor: pointer;" style-hover="background: var(--color-accent-200); color: var(--color-accent-800);">Interactives</button>
      <button onClick="{{ goLesson }}" style="border: 0; color: #fff; font-family: var(--font-body); font-size: 15px; font-weight: 700; padding: 8.8px 22px; border-radius: 999px; cursor: pointer; margin-left: 8.8px; background-color: #0C0C0C" style-hover="background: var(--color-accent-600);">Pick up where I left off</button>
    </nav>
  </header>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
  <main style="max-width: 1180px; margin: 0 auto; padding: 70px 44px 105px; background-color: #FBFBFB; box-shadow: 0px 4px 12px 0px #3A282826">
    <div style="max-width: 700px;">
      
      <h1 style="font-family: Work Sans; font-size: 62px; line-height: 1.04; margin: 0 0 26.4px; text-wrap: pretty; width: 888px; height: 118px">Mathematics Interactive&nbsp;</h1>
      
      <h2 style="font-family: var(--font-heading); font-size: 32px; margin: 0;">Courses</h2>
    </div>

    <div style="display: grid; grid-template-columns: repeat({{ courseColumns }}, minmax(0, 1fr)); gap: 22px; margin-top: 22px;">
      <sc-for list="{{ courses }}" as="c" hint-placeholder-count="4">
        <article onClick="{{ c.open }}" style="{{ c.cardStyle }}" style-hover="transform: translateY(-4px); box-shadow: var(--shadow-lg);">
          <div style="{{ c.blobStyle }}"></div>
          
        <div style="position: relative; z-index: 1;">
            <span style="display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; padding: 5px 13.2px; border-radius: 999px; background: rgba(255,255,255,0.55); color: var(--color-neutral-800);">{{ c.band }}</span>
            <h3 style="font-family: var(--font-heading); font-size: 27px; line-height: 1.15; margin: 17.6px 0 8.8px;">{{ c.title }}</h3>
            <p style="font-size: 15px; line-height: 1.5; color: var(--color-neutral-800); margin: 0 0 26.4px; text-wrap: pretty;">{{ c.blurb }}</p>
            <div style="display: flex; align-items: center; gap: 8.8px; font-size: 14px; font-weight: 700; color: var(--color-neutral-800);">
              <span>{{ c.count }}</span>
              <span style="opacity: 0.4;">/</span>
              <span>{{ c.next }}</span>
            </div>
          </div></article>
      </sc-for>
    </div>

    <div style="margin-top: 88px; background: #fff0bf; border-radius: 28px; padding: 44px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 44px; align-items: center;">
      <div>
        <h2 style="font-family: var(--font-heading); font-size: 30px; margin: 0 0 13.2px;">A note on how to use this</h2>
        <p style="font-size: 17px; line-height: 1.6; color: var(--color-accent-2-800); margin: 0; text-wrap: pretty;">Read the notes, then break the interactive. Genuinely — drag the sliders to silly values and see whether the formula still behaves. If something doesn't make sense, that is useful information and I would like to hear about it in class.</p>
      </div>
      <div style="display: grid; gap: 13.2px;">
        <sc-for list="{{ howto }}" as="h" hint-placeholder-count="3">
          <div style="display: flex; gap: 13.2px; align-items: flex-start; background: var(--color-neutral-100); border-radius: 16px; padding: 15px 17.6px;">
            <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--color-accent-2-600); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700;">{{ h.n }}</span>
            <span style="font-size: 15px; line-height: 1.45;">{{ h.text }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
  </sc-if>

  <sc-if value="{{ isCourse }}" hint-placeholder-val="{{ false }}">
  <main style="max-width: 1180px; margin: 0 auto; padding: 44px 44px 105px;">
    <div style="display: flex; gap: 8.8px; font-size: 14px; color: var(--color-neutral-600); margin-bottom: 35.2px;">
      <span onClick="{{ goHome }}" style="cursor: pointer; font-weight: 600; color: var(--color-accent-700);">Courses</span>
      <span>/</span>
      <span>Specialist Maths</span>
    </div>
    <p style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 13.2px;">Units 3 &amp; 4</p>
    <h1 style="font-family: var(--font-heading); font-size: 52px; line-height: 1.06; margin: 0 0 17.6px;">Specialist Maths</h1>
    <p style="font-size: 19px; line-height: 1.55; color: var(--color-neutral-700); margin: 0; max-width: 680px; text-wrap: pretty;">{{ courseSummary }}</p>
    <div style="display: grid; gap: 52px; margin-top: 52px;">
      <sc-for list="{{ strands }}" as="st" hint-placeholder-count="5">
        <section>
          <div style="display: flex; align-items: center; gap: 13.2px; margin-bottom: 17.6px;">
            <span style="{{ st.dotStyle }}"></span>
            <h2 style="font-family: var(--font-heading); font-size: 26px; margin: 0;">{{ st.name }}</h2>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 17.6px;">
            <sc-for list="{{ st.topics }}" as="tp" hint-placeholder-count="3">
              <article onClick="{{ tp.open }}" style="{{ tp.cardStyle }}" style-hover="transform: translateY(-4px); box-shadow: var(--shadow-lg);">
                <div style="{{ tp.blobStyle }}"></div>
                <div style="position: relative; z-index: 1; display: grid; gap: 8.8px;">
                  <sc-if value="{{ tp.unit }}" hint-placeholder-val="{{ false }}">
                    <span style="justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.6); color: var(--color-neutral-800);">{{ tp.unit }}</span>
                  </sc-if>
                  <h3 style="font-family: var(--font-heading); font-size: 23px; line-height: 1.2; margin: 0;">{{ tp.title }}</h3>
                  <p style="font-size: 14px; line-height: 1.5; color: var(--color-neutral-800); margin: 0; text-wrap: pretty;">{{ tp.intro }}</p>
                  <span style="font-size: 14px; font-weight: 700; color: var(--color-neutral-800); margin-top: 4px;">{{ tp.meta }}</span>
                </div>
              </article>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
  </sc-if>

  <sc-if value="{{ isTopic }}" hint-placeholder-val="{{ false }}">
  <main style="max-width: 1180px; margin: 0 auto; padding: 44px 44px 105px;">
    <div style="display: flex; gap: 8.8px; font-size: 14px; color: var(--color-neutral-600); margin-bottom: 35.2px;">
      <span onClick="{{ goHome }}" style="cursor: pointer; font-weight: 600; color: var(--color-accent-700);">Courses</span>
      <span>/</span>
      <span onClick="{{ goCourse }}" style="cursor: pointer; font-weight: 600; color: var(--color-accent-700);">Specialist Maths</span>
      <span>/</span>
      <span>{{ topic.title }}</span>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 70px; align-items: start;">
      <div>
        <p style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 13.2px;">{{ topic.kicker }}</p>
        <h1 style="font-family: var(--font-heading); font-size: 52px; line-height: 1.06; margin: 0 0 22px;">{{ topic.title }}</h1>
        <p style="font-size: 19px; line-height: 1.55; color: var(--color-neutral-700); margin: 0; text-wrap: pretty;">{{ topic.intro }}</p>
      </div>
      <div style="{{ topic.panelStyle }}">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 13.2px;">
          <sc-for list="{{ topic.stats }}" as="sx" hint-placeholder-count="2">
            <div style="background: rgba(255,255,255,0.65); border-radius: 16px; padding: 15px 17.6px;">
              <div style="font-family: var(--font-heading); font-size: 30px; line-height: 1;">{{ sx.value }}</div>
              <div style="font-size: 13px; font-weight: 700; color: var(--color-neutral-800); margin-top: 6px;">{{ sx.label }}</div>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8.8px; flex-wrap: wrap; margin-top: 17.6px;">
          <button onClick="{{ topic.prev }}" style="flex: 1; min-width: 120px; background: rgba(255,255,255,0.65); border: 0; color: var(--color-neutral-900); font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 12px 17.6px; border-radius: 999px; cursor: pointer; text-align: left;" style-hover="background: #fff;">← {{ topic.prevTitle }}</button>
          <button onClick="{{ topic.next }}" style="flex: 1; min-width: 120px; background: rgba(255,255,255,0.65); border: 0; color: var(--color-neutral-900); font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 12px 17.6px; border-radius: 999px; cursor: pointer; text-align: right;" style-hover="background: #fff;">{{ topic.nextTitle }} →</button>
        </div>
      </div>
    </div>

    <h2 style="font-family: var(--font-heading); font-size: 26px; margin: 70px 0 22px;">Lessons</h2>
    <div style="display: grid; gap: 13.2px;">
      <sc-for list="{{ lessons }}" as="l" hint-placeholder-count="7">
        <article onClick="{{ l.open }}" style="{{ l.rowStyle }}" style-hover="{{ l.hoverStyle }}">
          <div style="{{ l.numStyle }}">
            <sc-if value="{{ l.done }}" hint-placeholder-val="{{ false }}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </sc-if>
            <sc-if value="{{ l.notDone }}" hint-placeholder-val="{{ true }}">
              <span>{{ l.n }}</span>
            </sc-if>
          </div>
          <div style="min-width: 0;">
            <h3 style="font-family: var(--font-heading); font-size: 22px; margin: 0 0 6px; line-height: 1.2;">{{ l.title }}</h3>
            <p style="font-size: 15px; line-height: 1.45; color: var(--color-neutral-700); margin: 0; text-wrap: pretty;">{{ l.blurb }}</p>
            <sc-if value="{{ l.practice }}" hint-placeholder-val="{{ false }}">
              <p style="font-size: 14px; line-height: 1.45; font-weight: 600; color: var(--color-neutral-800); margin: 8px 0 0;">Practice: {{ l.practice }}</p>
            </sc-if>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center;">
            <sc-for list="{{ l.chips }}" as="chip" hint-placeholder-count="2">
              <span style="{{ chip.style }}">{{ chip.label }}</span>
            </sc-for>
          </div>
          <div style="font-size: 14px; font-weight: 700; color: var(--color-neutral-600); white-space: nowrap; text-align: right;">{{ l.mins }}</div>
        </article>
      </sc-for>
    </div>
    <section style="margin-top: 70px;">
      <div style="display: flex; align-items: baseline; gap: 17.6px; flex-wrap: wrap; margin-bottom: 22px;">
        <h2 style="font-family: var(--font-heading); font-size: 26px; margin: 0;">Exam watch</h2>
        <span style="font-size: 15px; color: var(--color-neutral-700);">Patterns from this year's trial and NHT papers</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px; align-items: start;">
        <div style="background: var(--color-neutral-100); border-radius: 28px; padding: 30px; box-shadow: var(--shadow-sm);">
          <h3 style="font-family: var(--font-heading); font-size: 20px; margin: 0 0 17.6px;">How it shows up</h3>
          <div style="display: grid; gap: 15px;">
            <sc-for list="{{ exam.patterns }}" as="pt" hint-placeholder-count="3">
              <div style="display: grid; gap: 6px;">
                <span style="font-size: 16px; line-height: 1.5; text-wrap: pretty;">{{ pt.text }}</span>
                <span style="{{ pt.srcStyle }}">{{ pt.src }}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="{{ exam.cardStyle }}">
          <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 10px;">Tricky one · {{ exam.marks }}</p>
          <p style="font-size: 18px; line-height: 1.55; margin: 0 0 20px; text-wrap: pretty;">{{ exam.question }}</p>
          <div style="display: grid; gap: 10px;">
            <sc-for list="{{ exam.shownSteps }}" as="sp" hint-placeholder-count="0">
              <div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; background: rgba(255,255,255,0.7); border-radius: 16px; padding: 12px 15px;">
                <span style="width: 26px; height: 26px; border-radius: 999px; background: var(--color-neutral-900); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700;">{{ sp.n }}</span>
                <span style="font-size: 16px; line-height: 1.5;">{{ sp.text }}</span>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{ exam.finished }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 15px 17.6px; margin-top: 12px;">
              <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; background: #f2542d; color: #fff; display: grid; place-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
              </span>
              <span style="font-size: 15px; line-height: 1.5;"><strong>Where marks go missing:</strong> {{ exam.trap }}</span>
            </div>
          </sc-if>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px;">
            <button onClick="{{ exam.nextStep }}" style="border: 0; background: var(--color-neutral-900); color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 15px; padding: 12px 24px; border-radius: 999px; cursor: pointer;" style-hover="background: #000;">{{ exam.nextLabel }}</button>
            <button onClick="{{ exam.reset }}" style="border: 0; background: rgba(255,255,255,0.7); color: var(--color-neutral-900); font-family: var(--font-body); font-weight: 700; font-size: 15px; padding: 12px 24px; border-radius: 999px; cursor: pointer;" style-hover="background: #fff;">Start again</button>
          </div>
          <p style="font-size: 13px; line-height: 1.45; margin: 15px 0 0; color: var(--color-neutral-800);">{{ exam.note }}</p>
        </div>
      </div>
    </section>
  </main>
  </sc-if>

  <sc-if value="{{ isLesson }}" hint-placeholder-val="{{ false }}">
  <main style="max-width: 1180px; margin: 0 auto; padding: 44px 44px 105px;">
    <div style="display: flex; gap: 8.8px; font-size: 14px; color: var(--color-neutral-600); margin-bottom: 30px;">
      <span onClick="{{ goHome }}" style="cursor: pointer; font-weight: 600; color: var(--color-accent-700);">Courses</span>
      <span>/</span>
      <span onClick="{{ goLessonTopic }}" style="cursor: pointer; font-weight: 600; color: var(--color-accent-700);">{{ lessonTopicTitle }}</span>
      <span>/</span>
      <span>{{ lessonCrumb }}</span>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 44px; flex-wrap: wrap;">
      <div style="max-width: 720px;">
        <p style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 13.2px;">{{ lessonKicker }}</p>
        <h1 style="font-family: var(--font-heading); font-size: 46px; line-height: 1.08; margin: 0 0 17.6px;">{{ lessonTitle }}</h1>
        <sc-if value="{{ hasIntro }}" hint-placeholder-val="{{ true }}"><p style="font-size: 19px; line-height: 1.55; color: var(--color-neutral-700); margin: 0; text-wrap: pretty;"><sc-for list="{{ lessonIntro }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.t }}" hint-placeholder-val="{{ false }}"><span>{{ sg.t }}</span></sc-if><sc-if value="{{ sg.b }}" hint-placeholder-val="{{ false }}"><strong>{{ sg.b }}</strong></sc-if><sc-if value="{{ sg.m }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.m }}"></span></sc-if><sc-if value="{{ sg.d }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.d }}" data-display="1" style="display: block; overflow-x: auto; margin: 6px 0;"></span></sc-if><sc-if value="{{ sg.c }}" hint-placeholder-val="{{ false }}"><span style="display: block; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; line-height: 1.6; background: #201e1d; color: #f5ead8; border-radius: 14px; padding: 12px 16px; margin: 8px 0;">{{ sg.c }}</span></sc-if></sc-for></p></sc-if>
      </div>
      <div style="display: flex; gap: 8.8px; flex-wrap: wrap;">
        <button onClick="{{ prevLesson }}" style="background: transparent; border: 2px solid var(--color-neutral-300); color: var(--color-neutral-800); font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 10px 20px; border-radius: 999px; cursor: pointer;" style-hover="border-color: var(--color-accent-400);">{{ prevLabel }}</button>
        <button onClick="{{ nextLesson }}" style="background: var(--color-accent); border: 0; color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 999px; cursor: pointer;" style-hover="background: var(--color-accent-600);">{{ nextLabel }}</button>
      </div>
    </div>

    <div style="display: flex; gap: 6px; margin: 44px 0 35.2px; padding: 6px; background: var(--color-neutral-200); border-radius: 999px; width: fit-content;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button onClick="{{ t.select }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>

    <sc-if value="{{ onNotes3 }}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 52px; align-items: start;">
      <article style="min-width: 0;">
        <h2 style="font-family: var(--font-heading); font-size: 28px; margin: 0px 0 15px;">The Dot Product</h2>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">If <span data-tex="\utilde{a} = a_1\utilde{i} + a_2\utilde{j} + a_3\utilde{k}"></span> and <span data-tex="\utilde{b} = b_1\utilde{i} + b_2\utilde{j} + b_3\utilde{k}"></span>, the scalar product is:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="\utilde{a} \cdot \utilde{b} = a_1b_1 + a_2b_2 + a_3b_3" data-display="1"></div></div>
        <h2 style="font-family: var(--font-heading); font-size: 28px; margin: 44px 0 15px;">Geometric Interpretation</h2>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">The scalar product can also be expressed as:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="\utilde{a} \cdot \utilde{b} = |\utilde{a}||\utilde{b}|\cos(\theta)" data-display="1"></div></div>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">where <span data-tex="\theta"></span> is the angle between the two ‘outgoing’ vectors.</p>
        <h2 style="font-family: var(--font-heading); font-size: 28px; margin: 44px 0 15px;">Properties of the Scalar Product</h2>
        <ol style="display: grid; gap: 8px; margin: 0; padding-left: 22px; font-size: 17px; line-height: 1.7; color: var(--color-neutral-800);">
          <li>The scalar product is a real number, <strong>not</strong> a vector.</li>
          <li>The scalar product is commutative: <span data-tex="\utilde{a} \cdot \utilde{b} = \utilde{b} \cdot \utilde{a}"></span></li>
          <li>The scalar product is distributive: <span data-tex="\utilde{a} \cdot (\utilde{b} + \utilde{c}) = \utilde{a} \cdot \utilde{b} + \utilde{a} \cdot \utilde{c}"></span></li>
          <li><span data-tex="m(\utilde{a} \cdot \utilde{b}) = (m\utilde{a}) \cdot \utilde{b} = \utilde{a} \cdot (m\utilde{b})"></span> for all <span data-tex="m \in \mathbb{R}"></span></li>
          <li><span data-tex="\utilde{a} \cdot \utilde{a} = |\utilde{a}|^2"></span></li>
          <li>The scalar product of perpendicular vectors is 0.</li>
        </ol>
        <h2 style="font-family: var(--font-heading); font-size: 28px; margin: 44px 0 15px;">Angle Between Two Vectors</h2>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">To find the angle between two vectors, rearrange the formula:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="\cos(\theta) = \dfrac{\utilde{a} \cdot \utilde{b} }{|\utilde{a}||\utilde{b}|}" data-display="1"></div></div>
        <h2 style="font-family: var(--font-heading); font-size: 28px; margin: 44px 0 15px;">Scalar and Vector Projections</h2>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">Any vector <span data-tex="\utilde{a}"></span> can be written as the sum of two vectors: one parallel to a given vector <span data-tex="\utilde{b}"></span> and one perpendicular to <span data-tex="\utilde{b}"></span>.</p>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">The <strong>scalar projection</strong> (or <strong>scalar resolute</strong>) of <span data-tex="\utilde{a}"></span> on <span data-tex="\utilde{b}"></span> is:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="\utilde{a} \cdot \hat{b}" data-display="1"></div></div>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">The <strong>vector projection</strong> (or <strong>vector resolute</strong>) of <span data-tex="\utilde{a}"></span> on <span data-tex="\utilde{b}"></span> is:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="(\utilde{a} \cdot \hat{b})\hat{b} = \dfrac{\utilde{a} \cdot \utilde{b} }{|\utilde{b}|^2}\utilde{b} = \dfrac{\utilde{a} \cdot \utilde{b} }{\utilde{b} \cdot \utilde{b} }\utilde{b}" data-display="1"></div></div>
        <p style="font-size: 17px; line-height: 1.7; color: var(--color-neutral-800); margin: 0 0 13.2px; text-wrap: pretty;">The <strong>vector projection</strong> of <span data-tex="\utilde{a}"></span> <strong>perpendicular</strong> to <span data-tex="\utilde{b}"></span> is:</p>
        <div style="background: #d4f3ea; border-radius: 28px; padding: 20px 30px; margin: 15px 0; color: #0b4a3e; font-size: 20px; overflow-x: auto;"><div data-tex="\utilde{a} - (\utilde{a} \cdot \hat{b})\hat{b}" data-display="1"></div></div>
        <div style="display: flex; gap: 17.6px; background: #ffd9cc; border-radius: 28px; padding: 26.4px 30px; margin: 35.2px 0 0;">
          <div style="flex: none; width: 38px; height: 38px; border-radius: 999px; background: #f2542d; color: #fff; display: grid; place-items: center;">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
          </div>
          <div>
            <p style="font-family: var(--font-heading); font-size: 20px; margin: 0 0 6px;">Watch out</p>
            <p style="font-size: 16px; line-height: 1.7; color: #7a1f08; margin: 0; text-wrap: pretty;">The scalar projection and the vector projection are not the same object. The scalar projection <span data-tex="\utilde{a} \cdot \hat{b}"></span> is a signed length. The vector projection is that length pointing along the unit vector <span data-tex="\hat{b}"></span>. Losing the <span data-tex="\hat{b}"></span> is the single most common mark drop in this topic.</p>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 17.6px; flex-wrap: wrap; background: #fff0bf; border-radius: 28px; padding: 22px 30px; margin-top: 35.2px;">

        </div>
      </article>

        <div style="background: var(--color-neutral-100); border: 2px solid #ffd96a; border-radius: 28px; padding: 22px 30px; box-shadow: var(--shadow-sm);"><span style="display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 13px; border-radius: 999px; background: #ffd96a; color: #5c3b00; margin-bottom: 12px;">Example 3.4</span><div style="font-size: 17px; line-height: 1.8;">Given that <span data-tex="A(-1, 3)"></span>, <span data-tex="B(3, 6)"></span> and <span data-tex="C(-4, 4)"></span>.<ol type="a" style="margin: 8px 0 0; padding-left: 22px; display: grid; gap: 4px;"><li>Find the vectors <span data-tex="\overrightarrow{AB}"></span> and <span data-tex="\overrightarrow{AC}"></span>.</li><li>Find the size of <span data-tex="\angle BAC"></span> to the nearest whole degree.</li></ol></div><div style="margin-top: 17.6px;"><x-import component-from-global-scope="work-pad" from="./work-pad.js" data-key="vectors-l3-ex4" hint-size="100%,440px"></x-import></div></div>

          <sc-if value="{{ blk.recall }}" hint-placeholder-val="{{ false }}"><div style="background: #e6dcff; border-radius: 28px; padding: 24px 30px; margin: 10px 0 22px; color: #35208a;"><span style="display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 13px; border-radius: 999px; background: #c9b6ff; color: #35208a; margin-bottom: 12px;">Recall from Unit 1</span><p style="font-size: 17px; line-height: 1.75; margin: 0;"><sc-for list="{{ blk.r1 }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.t }}" hint-placeholder-val="{{ false }}"><span>{{ sg.t }}</span></sc-if><sc-if value="{{ sg.b }}" hint-placeholder-val="{{ false }}"><strong>{{ sg.b }}</strong></sc-if><sc-if value="{{ sg.m }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.m }}"></span></sc-if><sc-if value="{{ sg.d }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.d }}" data-display="1" style="display: block; overflow-x: auto; margin: 6px 0;"></span></sc-if><sc-if value="{{ sg.c }}" hint-placeholder-val="{{ false }}"><span style="display: block; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; line-height: 1.6; background: #201e1d; color: #f5ead8; border-radius: 14px; padding: 12px 16px; margin: 8px 0;">{{ sg.c }}</span></sc-if></sc-for></p><div style="font-size: 19px; overflow-x: auto; margin: 10px 0;"><div data-tex="{{ blk.rf }}" data-display="1"></div></div><p style="font-size: 17px; line-height: 1.75; margin: 0; text-wrap: pretty;"><sc-for list="{{ blk.r2 }}" as="sg" hint-placeholder-count="1"><sc-if value="{{ sg.t }}" hint-placeholder-val="{{ false }}"><span>{{ sg.t }}</span></sc-if><sc-if value="{{ sg.b }}" hint-placeholder-val="{{ false }}"><strong>{{ sg.b }}</strong></sc-if><sc-if value="{{ sg.m }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.m }}"></span></sc-if><sc-if value="{{ sg.d }}" hint-placeholder-val="{{ false }}"><span data-tex="{{ sg.d }}" data-display="1" style="display: block; overflow-x: auto; margin: 6px 0;"></span></sc-if><sc-if value="{{ sg.c }}" hint-placeholder-val="{{ false }}"><span style="display: block; white-space: pre-wrap; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; line-height: 1.6; background: #201e1d; color: #f5ead8; border-radius: 14px; padding: 12px 16px; margin: 8px 0;">{{ sg.c }}</span></sc-if></sc-for></p></div></sc-if>
          <sc-if value="{{ blk.fig }}" hint-placeholder-val="{{ false }}"><div style="max-width: 520px; height: 240px; margin: 15px 0 22px;"><image-slot id="{{ blk.figId }}" shape="rounded" radius="24" fit="contain" placeholder="Drop the diagram from the notes"></image-slot></div></sc-if>
        </sc-for>
              </div>
              <div style="margin-top: 17.6px;"><x-import component-from-global-scope="work-pad" from="./work-pad.js" data-key="{{ ex.key }}" hint-size="100%,440px"></x-import></div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ hasQuiz }}" hint-placeholder-val="{{ true }}"><div style="margin-top: 52px;"><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 22px; margin-bottom: 26.4px;">
        <h2 style="font-family: var(--font-heading); font-size: 30px; margin: 0;">Check yourself</h2>
        <span style="font-size: 15px; font-weight: 700; color: var(--color-neutral-700);">{{ scoreLine }}</span>
      </div>
      <div style="display: grid; gap: 22px;">
        <sc-for list="{{ quiz }}" as="q" hint-placeholder-count="3">
          <div style="background: var(--color-neutral-100); border-radius: 28px; padding: 30px 35.2px; box-shadow: var(--shadow-sm);">
            <p style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); margin: 0 0 10px;">{{ q.kicker }}</p>
            <p style="font-size: 19px; line-height: 1.5; margin: 0 0 22px; text-wrap: pretty;">{{ q.prompt }}</p>
            <div style="display: grid; gap: 8.8px;">
              <sc-for list="{{ q.options }}" as="o" hint-placeholder-count="4">
                <button onClick="{{ o.pick }}" style="{{ o.style }}">{{ o.label }}</button>
              </sc-for>
            </div>
            <sc-if value="{{ q.answered }}" hint-placeholder-val="{{ false }}">
              <p style="{{ q.feedbackStyle }}">{{ q.feedback }}</p>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 26.4px; display: flex; gap: 13.2px;">
        <button onClick="{{ resetQuiz }}" style="background: transparent; border: 2px solid var(--color-neutral-300); color: var(--color-neutral-800); font-family: var(--font-body); font-weight: 700; font-size: 15px; padding: 12px 26px; border-radius: 999px; cursor: pointer;" style-hover="border-color: var(--color-accent-400); background: var(--color-accent-100);">Clear my answers</button>
      </div></div></sc-if>
      </div>
    </sc-if>
  </main>
  </sc-if>

  <footer style="border-top: 1px solid var(--color-divider); padding: 35.2px 44px; text-align: center; font-size: 14px; color: var(--color-neutral-600);">Built for my classes by Isabelle Hoadley. If something here is wrong, tell me and I will fix it before next lesson.</footer>
</div>
</script>

<script src="js/app.js"></script>
</body>

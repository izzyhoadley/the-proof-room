<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoadley Maths</title>
<meta name="description" content="Mathematics Interactive: Specialist Maths notes, interactives and practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/preact.umd.js"></script>
<style>body { margin: 0; background: #f5ead8; }</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family: sans-serif; padding: 40px;">This site needs JavaScript turned on.</p></noscript>

<script>
/*
 * Loads the site's own files (styles, scripts, page markup) asking the server for the
 * latest version every time, whatever caching the host is configured with. Unchanged
 * files come back as a quick "304 Not Modified", so students always see updates
 * without a hard refresh. KaTeX and Preact above never change, so they load normally.
 */
(function () {
  var STYLES = ["css/organic.css", "css/site.css"];
  var SCRIPTS = ["js/work-pad.js", "js/image-slot.js", "js/domino-demo.js", "js/runtime.js"];
  var TEMPLATE = "template.html";
  var APP = "js/app.js";

  function get(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(url + " (" + r.status + ")");
      return r.text();
    });
  }
  function run(code, url) {
    var s = document.createElement("script");
    s.textContent = code + "\n//# sourceURL=" + url;
    document.head.appendChild(s);
  }

  Promise.all([
    Promise.all(STYLES.map(get)),
    Promise.all(SCRIPTS.map(get)),
    get(TEMPLATE),
    get(APP)
  ]).then(function (res) {
    res[0].forEach(function (css) {
      var st = document.createElement("style");
      st.textContent = css;
      document.head.appendChild(st);
    });
    res[1].forEach(function (code, i) { run(code, SCRIPTS[i]); });
    var tpl = document.createElement("script");
    tpl.type = "text/x-template";
    tpl.id = "app-template";
    tpl.textContent = res[2];
    document.body.appendChild(tpl);
    run(res[3], APP);
  }).catch(function (err) {
    document.getElementById("app").innerHTML =
      '<p style="font-family: sans-serif; padding: 40px;">The site didn\u2019t load properly. Please refresh the page.</p>';
    console.error(err);
  });
})();
</script>
</body>
</html>
